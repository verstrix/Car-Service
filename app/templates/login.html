{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card">
      <div class="card-body p-4">
        <h3 class="mb-3">Вход</h3>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Потребителско име</label>
            <input class="form-control" type="text" name="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Парола</label>
            <input class="form-control" type="password" name="password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Вход</button>
        </form>
        <div class="small text-muted mt-3">manager / manager123<br>mechanic / mechanic123<br>client / client123</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
