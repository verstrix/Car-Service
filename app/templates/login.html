{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5 col-xl-4">
    <div class="card login-card">
      <div class="card-body p-4 p-lg-5">
        <div class="text-center mb-4">
          <div class="login-icon mb-3"><i class="bi bi-shield-lock"></i></div>
          <h3 class="mb-2">Вход</h3>
          <p class="text-muted mb-0">Използвайте демо акаунт или вашите данни за достъп.</p>
        </div>

        <form method="post">
          <div class="mb-3">
            <label class="form-label">Потребителско име</label>
            <input class="form-control" type="text" name="username" required autocomplete="username" autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Парола</label>
            <input class="form-control" type="password" name="password" required autocomplete="current-password">
          </div>
          <button class="btn btn-primary w-100" type="submit">Вход</button>
        </form>

        <div class="login-demo mt-4">
          <div class="small text-muted mb-2">Демо акаунти</div>
          <div class="login-demo-list">
            <span>manager / manager123</span>
            <span>mechanic / mechanic123</span>
            <span>client / client123</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
