{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">Редакция на част</h3>
<div class="card"><div class="card-body">
  <form method="post" enctype="multipart/form-data" class="row g-3">
    <div class="col-md-4"><label class="form-label">Номер</label><input class="form-control" name="part_number" value="{{ part.part_number }}" required></div>
    <div class="col-md-4"><label class="form-label">Име</label><input class="form-control" name="name" value="{{ part.name }}" required></div>
    <div class="col-md-2"><label class="form-label">Количество</label><input class="form-control" name="quantity" type="number" min="0" value="{{ part.quantity }}"></div>
    <div class="col-md-2"><label class="form-label">Мин. наличност</label><input class="form-control" name="min_quantity" type="number" min="0" value="{{ part.min_quantity }}"></div>
    <div class="col-md-3"><label class="form-label">Цена</label><input class="form-control" name="unit_price" type="number" step="0.01" min="0" value="{{ part.unit_price }}"></div>
    <div class="col-md-9"><label class="form-label">Описание</label><textarea class="form-control" name="description">{{ part.description or '' }}</textarea></div>
    <div class="col-md-6"><label class="form-label">Нова снимка</label><input class="form-control" type="file" name="image" accept="image/*"></div>
    {% if part.image_filename %}<div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" name="remove_image" value="1" id="removePartImage"><label class="form-check-label" for="removePartImage">Премахни текущата снимка</label></div>{% endif %}
    <div class="col-12 d-flex gap-2"><button class="btn btn-primary">Запази промените</button><a class="btn btn-outline-secondary" href="{{ url_for('part_details', part_id=part.id) }}">Отказ</a></div>
  </form>
</div></div>
{% endblock %}
