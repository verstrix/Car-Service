{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm border-0">
      <div class="card-body p-5 text-center">
        <div class="display-4 fw-bold text-primary mb-2">{{ code }}</div>
        <h2 class="h4 mb-3">{{ title }}</h2>
        <p class="text-muted mb-4">{{ message }}</p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
          {% if current_user.is_authenticated %}
          <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Към таблото</a>
          {% else %}
          <a href="{{ url_for('login') }}" class="btn btn-primary">Към вход</a>
          {% endif %}
          <a href="{{ url_for('landing') }}" class="btn btn-outline-secondary">Начална страница</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
